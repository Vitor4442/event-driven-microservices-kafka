services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    user: root

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./docs:/data

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    command: server --console-address ":9001" /data

    restart: unless-stopped